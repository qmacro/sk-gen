name: Generate Service Key

on:
  workflow_dispatch:

jobs:
  generate-service-key:
    name: Create CF service key and commit zipped output
    runs-on: ubuntu-latest

    env:
      # Hardcoded service instance and base key name - a short GUID is appended at runtime
      CF_SERVICE_INSTANCE: my-service-instance
      CF_SERVICE_KEY_BASE: my-service-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate unique service key name
        run: |
          GUID=$(cat /proc/sys/kernel/random/uuid | tr -d '-' | cut -c1-8)
          CF_SERVICE_KEY="${CF_SERVICE_KEY_BASE}-${GUID}"
          echo "CF_SERVICE_KEY=${CF_SERVICE_KEY}" >> "$GITHUB_ENV"
          echo "Service key name: $CF_SERVICE_KEY"

      - name: Install cf CLI v8
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cf-cli.gpg
          echo "deb [signed-by=/usr/share/keyrings/cf-cli.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update -q
          sudo apt-get install -y cf8-cli

      - name: Authenticate with Cloud Foundry
        env:
          CF_API:      ${{ secrets.CF_API }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG:      ${{ secrets.CF_ORG }}
          CF_SPACE:    ${{ secrets.CF_SPACE }}
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: Create service key
        run: cf create-service-key "$CF_SERVICE_INSTANCE" "$CF_SERVICE_KEY"

      - name: Retrieve service key and write to zip
        run: |
          mkdir -p keys
          OUTFILE="keys/${CF_SERVICE_KEY}.json"
          ZIPFILE="keys/${CF_SERVICE_KEY}.zip"

          # Write raw JSON content (strip the two informational header lines cf emits)
          cf service-key "$CF_SERVICE_INSTANCE" "$CF_SERVICE_KEY" \
            | tail -n +3 \
            > "$OUTFILE"

          # Zip with maximum compression; keep only the file, no directory prefix
          zip -9j "$ZIPFILE" "$OUTFILE"

          # Remove the plain JSON file so only the zip is committed
          rm "$OUTFILE"

          echo "Created $ZIPFILE"
          ls -lh keys/

      - name: Commit and push zip file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "keys/${CF_SERVICE_KEY}.zip"

          if git diff --cached --quiet; then
            echo "No changes to commit (zip already up to date)"
          else
            git commit -m "chore: add service key ${CF_SERVICE_KEY} [skip ci]"
            git push
          fi
